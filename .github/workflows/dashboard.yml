name: Profil panosu
 
on:
  schedule:
    - cron: "0 */6 * * *"   # 6 saatte bir günceller
  workflow_dispatch:         # elle çalıştırma butonu
  push:
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Panoyu üret
        env:
          GH_USER: ${{ github.repository_owner }}
          # GH_PAT eklersen private repolar da dil istatistiğine dahil olur
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: python generate.py
 
      - name: output dalına yükle
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
